name: locallink
publish_to: 'none'
description: LinkUp offline LAN communication client.
version: 3.0.71+142

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.9.0
  crypto: ^3.0.7
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  lottie: ^3.3.1
  share_plus: ^10.1.4
  video_player: ^2.9.2

  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/brand/
  # Bundle 216: Roboto for the admin pages only (AdminTheme216).
  fonts:
    - family: Roboto216
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
