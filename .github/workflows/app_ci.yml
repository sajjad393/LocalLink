# Bundle 264/268: app checks after every push to main.
# R268-1: the release HTTP rule runs with release constants, and the release
# APK is built with the one standard command (tool/build_release_apk.ps1).
# A red mark only warns you; it never stops a push. Phones, radios and calls
# can't be tested here (no Wi-Fi Direct / Bluetooth on GitHub machines).
name: App CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      - name: Format (report only - the code was never auto-formatted)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test > format_report.txt 2>&1 || (tail -5 format_report.txt; exit 1)
      - name: Analyze (errors fail, old warnings only warn)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests + coverage
        run: flutter test --coverage --reporter expanded > flutter_test.txt 2>&1; code=$?; tail -40 flutter_test.txt; exit $code
      - name: Release HTTP rule, release constants without the flag (R268-1)
        if: success() || failure()
        run: flutter test --dart-define=dart.vm.product=true --dart-define=RT268_MODE=release test/security_release_268_test.dart
      - name: Release HTTP rule, release constants with the flag (R268-1)
        if: success() || failure()
        run: flutter test --dart-define=dart.vm.product=true --dart-define=LOCLINK_ALLOW_INSECURE_HTTP=true --dart-define=RT268_MODE=release_flag test/security_release_268_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-results
          path: |
            flutter_test.txt
            format_report.txt
            coverage/lcov.info
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      - name: Debug APK (compiles Kotlin + Dart for Android)
        run: flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: android
        # Bundle 270: only the app's own tests (plugin tests are not ours).
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Release APK with the standard command (R268-1, signed with this machine's debug key - not for phones)
        if: success() || failure()
        run: flutter build apk --release --dart-define=LOCLINK_ALLOW_INSECURE_HTTP=true --target-platform android-arm,android-arm64
      - name: APK size (Bundle 301, report only)
        if: success()
        run: |
          ls -l build/app/outputs/flutter-apk/app-release.apk
          unzip -v build/app/outputs/flutter-apk/app-release.apk | grep 'lib/'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-test-results
          path: build/app/reports/tests/
          retention-days: 14
