plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.sajjad.locallink"
    compileSdk flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "com.sajjad.linkup"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        // Bundle 301: ARM 32 + ARM 64 only (every LinkUp phone, one APK for
        // all; x86_64 is only PC emulators / Chromebooks). The Flutter Gradle
        // plugin already put armeabi-v7a, arm64-v8a AND x86_64 here when it
        // was applied (plugins block, before this file's android block), so
        // clear its list and set ours; adding alone would keep x86_64.
        ndk {
            abiFilters.clear()
            abiFilters.addAll(['armeabi-v7a', 'arm64-v8a'])
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        // Bundle 270: the source-check tests read "main/kotlin/..." (relative
        // to src/, as the local test runner does). Gradle starts tests in the
        // module folder, so they could not find the files.
        unitTests.all { workingDir = file("src") }
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("LOCLINK_RELEASE_STORE_FILE")
            def storePasswordValue = System.getenv("LOCLINK_RELEASE_STORE_PASSWORD")
            def keyAliasValue = System.getenv("LOCLINK_RELEASE_KEY_ALIAS")
            def keyPasswordValue = System.getenv("LOCLINK_RELEASE_KEY_PASSWORD")
            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    // Bundle 301: smaller APK. Native code (.so) is stored compressed in the
    // APK and unpacked once at install. Before, Android Gradle stored it raw
    // (minSdk 24), so the download / share size was the full raw size.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (System.getenv("LOCLINK_RELEASE_STORE_FILE") &&
                    System.getenv("LOCLINK_RELEASE_STORE_PASSWORD") &&
                    System.getenv("LOCLINK_RELEASE_KEY_ALIAS") &&
                    System.getenv("LOCLINK_RELEASE_KEY_PASSWORD")) {
                signingConfig signingConfigs.release
            } else {
                // Bundle 95: without the release env keys the build used to
                // ship an UNSIGNED release APK (`INSTALL_PARSE_FAILED_NO_CERTIFICATES`
                // on every install). Sign with the debug key instead — the
                // debug key is identical across our installs, so updates keep
                // working during development; only Play-Store distribution
                // must set the env vars above.
                signingConfig signingConfigs.debug
                // Bundle 246 (S10): say it clearly. Lose this key = phones
                // can't update (uninstall + data loss). Back it up.
                if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
                    logger.warn("WARNING: LinkUp release APK is signed with the DEBUG key " +
                            "(~/.android/debug.keystore). Keep a backup of that file (USB + cloud); " +
                            "without it, installed phones cannot take updates.")
                }
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Bundle 175 (5): health check only (never sockets / messages).
    implementation "androidx.work:work-runtime:2.9.1"
    testImplementation "junit:junit:4.13.2"
    // Real org.json for local unit tests: the mocked android.jar stubs org.json
    // (returns null with returnDefaultValues=true), which broke every mesh
    // packet serialization suite. This jar runs the real implementation,
    // exactly as the app does on device.
    testImplementation "org.json:json:20231013"
}

flutter {
    source "../.."
}
